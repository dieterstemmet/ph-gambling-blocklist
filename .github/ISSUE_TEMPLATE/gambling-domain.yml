name: Report a gambling domain
description: Submit a missed Philippine gambling hostname with public evidence.
title: "Add gambling domain: "
body:
  - type: markdown
    attributes:
      value: "Submit hostnames and public evidence only. Do not post query logs, browsing history, credentials, personal details or referral tokens. No signup or deposit is needed."
  - type: input
    id: domain
    attributes:
      label: Hostname
      placeholder: casino.example
    validations:
      required: true
  - type: input
    id: evidence
    attributes:
      label: Public evidence URL
      description: A regulator entry, platform announcement or documented report identifying this hostname.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Gambling use and Philippine connection
      description: Describe what the source establishes and when you checked it. Mention a parent platform if this is a mirror.
    validations:
      required: true
  - type: dropdown
    id: discovery_channel
    attributes:
      label: Where the promotion appeared
      options:
        - Facebook or Instagram ad/post
        - YouTube or other public video
        - Public Telegram channel
        - Search result or affiliate website
        - SMS or private message (hostname only)
        - Regulator notice or public report
        - Other public source
